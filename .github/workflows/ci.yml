name: build-and-test

on:
  push:
    branches: [ main, moblimiter ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn -B -ntp clean package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: MobLimiter-jar
          path: target/MobLimiter-*.jar

      - name: Download Folia 1.21.11
        run: |
          mkdir -p ci-server/plugins
          cd ci-server
          URL=$(curl -s https://fill.papermc.io/v3/projects/folia/versions/1.21.11/builds/latest | jq -r '.downloads."server:default".url // empty' || true)
          if [ -z "$URL" ]; then
            URL="https://fill-data.papermc.io/v1/objects/f52c408490a0225611e67907a3ca19f7e6da2c6bc899e715d5f46844e7103c39/folia-1.21.11-14.jar"
          fi
          echo "Downloading $URL"
          curl -sSL -o folia.jar "$URL"
          ls -la folia.jar

      - name: Integration test on a real Folia server
        run: bash ci/integration-test.sh 2>&1 | tee ci-server/integration.log

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: |
            ci-server/server.log
            ci-server/integration.log
          if-no-files-found: ignore

      - name: Post failure log to PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: $ github.token 
        run: |
          LOG=$(tail -c 55000 ci-server/integration.log 2>/dev/null || echo "no log available")
          {
            echo "### CI failure log (tail)"
            echo
            echo '```'
            echo "$LOG"
            echo '```'
          } > /tmp/pr-comment-body.md
          gh pr comment "$ github.event.pull_request.number " --repo "$ github.repository " --body-file /tmp/pr-comment-body.md
